apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roast-co-dev-ingress
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: roast-co-service
              port:
                number: 80