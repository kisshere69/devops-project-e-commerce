name: Setup Database Access

on:
    workflow_dispatch:

permissions:
    contents: read

env:
    AWS_REGION: eu-central-1
    EKS_CLUSTER_NAME: roast-co-dev
    KUBERNETES_NAMESPACE: dev

jobs:
    setup-db-access:
        name: Setup Kubernetes Database Access
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
                aws-region: ${{ env.AWS_REGION }}

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Configure kubectl
              run: |
                aws eks update-kubeconfig \
                  --region "$AWS_REGION" \
                  --name "$EKS_CLUSTER_NAME"

            - name: Verify EKS access
              run: |
                kubectl auth can-i create serviceaccounts -n "$KUBERNETES_NAMESPACE"
                kubectl auth can-i create secretproviderclasses.secrets-store.csi.x-k8s.io -n "$KUBERNETES_NAMESPACE"

            - name: Apply database access configuration
              run: |
                kubectl apply -f k8s/db-migration-serviceaccount.yaml
                kubectl apply -f k8s/db-secret-provider.yaml

            - name: Verify database access configuration
              run: |
                kubectl get serviceaccount db-migration \
                    -n "$KUBERNETES_NAMESPACE"

                kubectl get secretproviderclass db-secret \
                    -n "$KUBERNETES_NAMESPACE"