name: CI/CD Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: roast-co-app
  EKS_CLUSTER_NAME: roast-co-dev

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Terraform initialization
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform validation
        working-directory: terraform/environments/dev
        run: terraform validate

  docker-checks:
    name: Docker Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Docker build validation
        run: docker build -t roast-co-app:ci .

      - name: Scan application image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: roast-co-app:ci
          format: table
          exit-code: '1'
          severity: "HIGH, CRITICAL"
          vuln-type: 'os,library'
          ignore-unfixed: true

  app-checks:
    name: Application Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: pip-audit

      - name: Format Python code with Ruff
        run: ruff format --check app

      - name: Lint Python code with Ruff
        run: ruff check app

      - name: Compile Python files
        run: python -m compileall app

      - name: Smoke test
        working-directory: app
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          response = client.get("/health")
          assert response.status_code == 200, response.data
          data = response.get_json()
          assert data["status"] == "healthy", data
          print("Health check passed")
          PY

      - name: Security scan
        run: bandit -r app

  build-and-push:
    needs:
      - terraform-checks
      - docker-checks
      - app-checks

    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.tag }} .
          docker push $REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy App with Helm

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Get ACM certificate ARN
        id: acm
        run: |
          CERTIFICATE_ARN = "$(aws acm list-certificates \
            --region "$AWS_REGION" \
            --query "CertificateSummaryList[?DomainName=='roast-and-co.online'].CertificateArn | [0]" \
            --output text)"
            
          if [ -z "$CERTIFICATE_ARN" ] || [ "$CERTIFICATE_ARN" = "None" ]; then
            echo "ACM certificate for roast-and-co.online was not found"
            exit 1
          fi

          echo "Certificate ARN: $CERTIFICATE_ARN"
          echo "certificate-arn=$CERTIFICATE_ARN" >> "$GITHUB_OUTPUT"

      - name: Helm Upgrade
        env:
          IMAGE_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          CERTIFICATE_ARN: ${{ steps.acm.outputs.certificate-arn }}
        run: |
          helm upgrade --install roast-co ./helm \
            --namespace dev \
            --values ./helm/values-dev.yaml \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set ingress.certificateArn="$CERTIFICATE_ARN" \
            --wait \
            --timeout 5m