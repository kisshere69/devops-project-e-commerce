services:
  postgres:
    image: postgres:16.15-alpine

    container_name: roast-co-postgres

    environment:
      POSTGRES_DB: coffee_shop
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: roast-co-app

    environment:
      DATABASE_URL: postgresql://coffee:coffee@postgres:5432/coffee_shop
      SECRET_KEY: dev-secret-key

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: roast-co-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - app

volumes:
  postgres_data: