<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Roast & Co.
        {% endblock %}
    </title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', filename='images/tab logo.png') }}"
    >

</head>

<body>

<header class="site-header">
    <div class="container navigation">

        <!-- LEFT: Menu -->
        <div class="menu-wrapper">

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                <img
                    src="{{ url_for('static', filename='images/menu dropdown.png') }}"
                    alt=""
                    class="menu-toggle-icon"
                >
            </button>

            <nav
                class="dropdown-menu"
                id="dropdownMenu"
            >
                <a href="/" class="dropdown-item">
                    Home
                </a>

                <a href="/#menu" class="dropdown-item">
                    Menu
                </a>

                <a href="/#about" class="dropdown-item">
                    About
                </a>
            </nav>

        </div>


        <!-- CENTER: Company logo -->
        <a href="/" class="brand-logo">
            <img
                src="{{ url_for('static', filename='images/company logo.png') }}"
                alt="Roast & Co."
                class="brand-logo-image"
            >
        </a>


        <!-- RIGHT: Cart -->
        <a
            href="/cart"
            class="cart-link"
        >
            <img
                src="{{ url_for('static', filename='images/cart.png') }}"
                alt=""
                class="cart-icon"
            >

            <span>
                Cart
            </span>

            {% if cart_count > 0 %}
                <span class="cart-count">
                    {{ cart_count }}
                </span>
                {% endif %}
        </a>

    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="site-footer">
    <div class="container">
        <p>
            © 2026 Roast & Co.
        </p>
    </div>
</footer>

<script
    src="{{ url_for('static', filename='js/navigation.js') }}"
></script>

</body>
</html>
