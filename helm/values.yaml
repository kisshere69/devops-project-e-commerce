replicaCount: 2

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

container:
  port: 5000

config:
  applicationName: roast-co
  environment: dev
  logLevel: INFO

secret:
  existingSecret: roast-co-secret
  key: SECRET_KEY

probes:
  startup:
    path: /
    port: 5000
    failureThreshold: 5
    periodSeconds: 12

  liveness:
    path: /health
    port: 5000
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  readiness:
    path: /health/db
    port: 5000
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

resources:
  requests:
    memory: 64Mi
    cpu: 100m

  limits:
    memory: 128Mi
    cpu: 500m

ingress:
  enabled: true
  host: roast-and-co.online
  certificateArn: ""