apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "roast-co.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roast-co.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.applicationName | quote }}
  APP_ENV: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}